name: void-inspect-dev
services:
  web:
    image: void-inspect:dev
    build: .
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${VOID_PORT:-8001}:8000"
    volumes:
      - .:/app:ro
      - ./.runtime:/app/.runtime
    environment:
      VOID_DEV_RELOAD: "1"
    command: ["python", "-m", "uvicorn", "server:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
